# For DDP runs (single process across multiple GPUs)

# command_timeout: 24h  # Timeout for each run
# run_cap: 1  # Only run one configuration at a time (not needed for ddp and gradient_accumulation_steps setup)

program: train.py
method: grid
project: VSLM
entity: wcml

metric:
  name: eval/val_loss
  goal: minimize

parameters:
  # Base config and output structure
  config_path:
    value: config/train_tinystories.py
  out_dir:
    value: runs/sweeps/${sweep_id}  # Dynamic sweep directory
    
  # Multi-dataset configuration
  datasets:
    value: '{"openwebtext":0.4,"wikipedia":0.3,"books":0.2,"tinystories":0.1}'
  
  model_architecture:
    value: 'original'
  
  base_dim:
    values: [384, 512, 640, 768, 896, 1024]
  
  # Fixed parameters
  n_layer:
    value: 12
  head_dim:
    value: 64
  learning_rate:
    value: 0.0003
  warmup_iters:
    value: 500
  dropout:
    value: 0.1
  weight_decay:
    value: 0.01
  batch_size: 
    value: 16  # Reduced batch size since we're using DDP
  gradient_accumulation_steps:
    value: 2   # Increased to compensate for reduced batch size
  max_iters:
    value: 10000
  wandb_project:
    value: "VSLM"
  wandb_entity:
    value: "wcml"

# Command configuration for DDP
command:
  - ${env}
  - WANDB_SWEEP_ID=${sweep_id}  # Pass sweep ID to train.py
  - torchrun
  - --standalone
  - --nproc_per_node=${num_gpus}
  - ${program}
  - ${args_no_hyphens}
