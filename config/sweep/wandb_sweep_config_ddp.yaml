# For DDP runs (single process across multiple GPUs)

program: train.py
method: grid
project: VSLM
entity: wcml

metric:
  name: eval/val_loss
  goal: minimize

parameters:
  # Base dimensions sweep
  base_dim:
    values: [384, 512, 640, 768, 896, 1024]

  wandb_log:
    value: true

  # Fixed architecture parameters  
  model_architecture:
    value: 'original'
  n_layer:
    value: 12
  head_dim:
    value: 64

  # Training parameters
  learning_rate:
    value: 0.0003
  warmup_iters:
    value: 500
  dropout:
    value: 0.1
  weight_decay:
    value: 0.01
  batch_size:
    value: 16
  gradient_accumulation_steps:
    value: 2
  max_iters:
    value: 10000

  # Wandb settings
  wandb_project:
    value: "VSLM"
  wandb_entity:
    value: "wcml"

  # Output directory with sweep ID
  out_dir:
    value: 'runs/sweeps/\@\@SWEEPID\@\@'

# Command configuration for DDP
command:
  - ${env}
  - WANDB_SWEEP_ID=${sweep_id}
  - torchrun
  - --standalone
  - --nproc_per_node=${num_gpus}
  - ${program}
  - ${args_no_hyphens}
