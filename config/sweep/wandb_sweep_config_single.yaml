# For single-GPU runs (one agent per GPU)
# command_timeout: 24h  # Timeout for each run
# run_cap: 1  # Only run one configuration at a time (keep it commented out)

program: train.py
method: grid
project: VSLM
entity: wcml

metric:
  name: eval/val_loss
  goal: minimize

# concurrency: 2  # <--- limit how many parallel runs happen at once
# run_cap: 6        # E.g. total of 6 runs, but concurrency:2 means 2 can run at once

parameters:
  # Now we can have out_dir reference ${sweep_id} via Hydra interpolation
  out_dir:
    value: "runs/sweeps/${oc.env:WANDB_SWEEP_ID,'undefined'}"  # Updated for Hydra oc.env syntax

  wandb_log:
    value: true

  # Base dimensions sweep
  base_dim:
    values: [384, 512, 640, 768, 896, 1024]
  
  # Fixed architecture parameters  
  model_architecture:
    value: 'original'
  n_layer:
    value: 12
  head_dim:
    value: 64

  # Remove multi-dataset config override, because Hydra does not parse
  # something like "datasets={'books':0.2,...}" as a single override.
  # Instead, rely on your default Hydra config for `datasets`.

  # Training parameters
  learning_rate:
    value: 0.0003
  warmup_iters:
    value: 500
  dropout:
    value: 0.1
  weight_decay:
    value: 0.01
  batch_size: 
    value: 16
  gradient_accumulation_steps:
    value: 1
  max_iters: 
    value: 2000

  # Wandb settings
  wandb_project:
    value: "VSLM"
  wandb_entity:
    value: "wcml"

# Command for single GPU runs
command:
  - python
  - train.py
  - +hydra.job.name=wandb_agent
  - +wandb_sweep_id=$WANDB_SWEEP_ID
  - +debug=$debug
  - ${args_no_hyphens}