defaults:
  - dataset/default         # Points to config/hydra/dataset/default.yaml
  - _self_                 # Include this file's configs

# Dataset configuration
datasets:
  openwebtext: 0.4
  wikipedia: 0.3
  books: 0.2
  tinystories: 0.1

# General training parameters
out_dir: "out"
eval_interval: 2000
log_interval: 200    # change it to lower(higher) number for more(less) logging
eval_iters: 200
eval_only: false
always_save_checkpoint: true

init_from: "scratch"  # or "resume" or "gpt2"
wandb_log: false
wandb_project: "VSLM"
wandb_entity: ""   # optional

# training hyperparams
gradient_accumulation_steps: 40
batch_size: 12
# block_size can go up to 1024, but results in OOM on single GPU run,
# but then, you can use gradient_accumulation_steps to increase the
# effective batch size or use DDP. Alternatively, the train.py code
# has OOM handling to reduce block_size by half until it fits.
block_size: 256
n_layer: 12
dropout: 0.0
bias: false
learning_rate: 0.0006
layer_dims: null
ddp: false
wandb_run_name: null
print_params_only: false
max_iters: 600000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
decay_lr: true
warmup_iters: 2000
lr_decay_iters: 600000
min_lr: 0.00006

# System settings
backend: "nccl"
device: "cuda"
dtype: "bfloat16"
compile: true

# Architecture settings
model_architecture: "original"
use_unet: false
base_dim: 384
n_heads: null
max_dim: 1024
head_dim: 64
shape_variant: "symmetry"
n_dims: null